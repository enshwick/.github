name: Wine or Proton probe

# By hand: the platform's Windows tests under Ubuntu's Wine, under the Wine
# of GE-Proton, or through umu-run with GE-Proton, on the organization
# runners or a GitHub-hosted runner. The setup and the tests are separate
# steps, so their times can be compared. GE-Proton is downloaded once into
# the runner's tool cache and checked against its published SHA-512; nothing
# is installed machine-wide.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: The enshwick/enshwick branch, tag or commit to test.
        type: string
        default: main
      runner:
        description: Where the tests run.
        type: choice
        options: [enshwick, ubuntu-26.04]
        default: enshwick
      layer:
        description: What runs the Windows test executables.
        type: choice
        options: [wine, ge-proton, umu]
        default: wine

permissions: {}

concurrency:
  group: wine-probe-${{ inputs.runner }}-${{ inputs.layer }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      LAYER: ${{ inputs.layer }}
      GE_PROTON: GE-Proton11-11
      GE_PROTON_SHA512: 45721a7b625b2404d8896bb5e2a8b87fc9623a394873a6dd6b900c839681d5c01ec694ca00d003fc9c733c5f6c5648af8171985656f9fa47e20999fbebdbe235
      UMU_VERSION: 1.4.4
      UMU_SHA256: eb590691841f7fad3fc3ad8fd5db4ccb87849fe7948e62b28ece7a4ee48cc851
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: enshwick/enshwick
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: enshwick/.github
          ref: main
          path: .enshwick-ci
          persist-credentials: false

      - uses: ./.enshwick-ci/.github/actions/setup-rust # zizmor: ignore[self-repository]
        with:
          # cargo-nextest 0.9.150 (2026-10-26) is not yet in install-action's manifests.
          tools: cargo-nextest@0.9.149
          wine: ${{ inputs.layer == 'wine' }}

      - name: GE-Proton
        if: inputs.layer != 'wine'
        run: | # zizmor: ignore[github-env] fixed paths only
          dir="${RUNNER_TOOL_CACHE:-$RUNNER_TEMP}/ge-proton/$GE_PROTON"
          if [ ! -x "$dir/files/bin/wine" ]; then
            archive="$RUNNER_TEMP/ge-proton.tar.gz"
            curl --proto '=https' --tlsv1.2 -sSfL -o "$archive" \
              "https://github.com/GloriousEggroll/proton-ge-custom/releases/download/$GE_PROTON/$GE_PROTON-x86_64.tar.gz"
            echo "$GE_PROTON_SHA512  $archive" | sha512sum -c -
            rm -rf "$dir.part"
            mkdir -p "$dir.part"
            tar -xzf "$archive" -C "$dir.part" --strip-components 1
            rm -f "$archive"
            mv "$dir.part" "$dir"
          fi
          prefix="$RUNNER_TEMP/proton-prefix"
          {
            echo "PROTONPATH=$dir"
            echo "WINEPREFIX=$prefix"
            echo "WINEDEBUG=-all"
          } >> "$GITHUB_ENV"
          echo "$dir/files/bin" >> "$GITHUB_PATH"
          PATH="$dir/files/bin:$PATH" WINEPREFIX="$prefix" WINEDEBUG=-all
          export PATH WINEPREFIX WINEDEBUG
          wine --version
          wineboot -i > /dev/null 2>&1
          wineserver -w
          test -f "$prefix/system.reg"

      - name: umu-run
        if: inputs.layer == 'umu'
        run: | # zizmor: ignore[github-env] fixed paths only
          archive="$RUNNER_TEMP/umu.tar"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$archive" \
            "https://github.com/Open-Wine-Components/umu-launcher/releases/download/$UMU_VERSION/umu-launcher-$UMU_VERSION-zipapp.tar"
          echo "$UMU_SHA256  $archive" | sha256sum -c -
          tar -xf "$archive" -C "$RUNNER_TEMP"
          {
            echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUNNER=$RUNNER_TEMP/umu/umu-run"
            echo "GAMEID=umu-default"
            echo "STORE=none"
            echo "PROTON_VERB=waitforexitandrun"
          } >> "$GITHUB_ENV"
          # The Steam Linux Runtime comes on the first run; fetch it here so
          # the tests' time is the tests'.
          GAMEID=umu-default STORE=none "$RUNNER_TEMP/umu/umu-run" cmd /c exit 0

      - name: Windows tests
        run: cargo xtask check --all --part windows-tests

      - name: Clean up
        if: always()
        run: rm -rf target "$RUNNER_TEMP/proton-prefix"
