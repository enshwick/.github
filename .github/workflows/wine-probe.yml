name: Wine probe

# By hand: the Windows tests of the platform's main under the Wine that
# setup-rust sets up, on the organization runners or a GitHub-hosted
# runner, with the setup and the tests as separate steps so their times
# compare. It uses the setup-rust of the commit it runs from, so a change
# to the Wine setup can be tried from its branch on a hosted runner before
# it merges; the organization runners take only main. Only the platform's
# main is tested: the organization runners share their caches with main's
# own runs.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Where the tests run.
        type: choice
        options: [enshwick, ubuntu-26.04]
        default: enshwick

permissions: {}

concurrency:
  group: wine-probe-${{ github.ref }}-${{ inputs.runner }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: enshwick/enshwick
          ref: main
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .enshwick-ci
          persist-credentials: false

      - uses: ./.enshwick-ci/.github/actions/setup-rust # zizmor: ignore[self-repository]
        with:
          # cargo-nextest 0.9.150 (2026-10-26) is not yet in install-action's manifests.
          tools: cargo-nextest@0.9.149
          wine: true

      - name: Windows tests
        run: cargo xtask check --all --part windows-tests

      - name: Clean up
        if: always()
        run: rm -rf target
