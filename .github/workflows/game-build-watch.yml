name: Game build watch

# Asks Steam for the public build of the Enshrouded dedicated server and
# client and opens one issue per build the caller's build tables do not name
# (`steam_build = <id>` in `<tables>/<side>-*.toml`). The build ids come from
# Steam's app info through api.steamcmd.net, which logs in anonymously; no
# Steam account is needed to see them. The caller grants `issues: write`.

on:
  workflow_call:
    inputs:
      tables:
        description: The directory of the build tables.
        type: string
        default: crates/enshwick-gamedata/tables
      pin:
        description: Port a new server build's table with `cargo enshwick pin` and open a pull request; needs the enshwick-ci secrets and a writable /ci-cache.
        type: boolean
        default: false
      rehearse:
        description: With pin, port the current server build's table from that build itself and run the compat report on it, then show the pull request it would open in the run summary instead of pushing it.
        type: boolean
        default: false
    secrets:
      ENSHWICK_CI_CLIENT_ID:
        required: false
      ENSHWICK_CI_PRIVATE_KEY:
        required: false

permissions: {}

jobs:
  # Only API calls: on a GitHub-hosted runner, so a frequent schedule costs
  # the organization runners nothing.
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    outputs:
      server-build: ${{ steps.builds.outputs.server-build }}
      server-manifest: ${{ steps.builds.outputs.server-manifest }}
      server-has-table: ${{ steps.builds.outputs.server-has-table }}
      seed: ${{ steps.builds.outputs.seed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: ${{ inputs.tables }}

      - name: Builds without a table
        id: builds
        env:
          GH_TOKEN: ${{ github.token }}
          TABLES: ${{ inputs.tables }}
          EVENT: ${{ github.event_name }}
        run: |
          seed=false
          if [ "$EVENT" = workflow_dispatch ] || [ "$(date -u +%H)" = 03 ]; then seed=true; fi
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          for entry in server:2278520 client:1203620; do
            side=${entry%%:*}
            app=${entry#*:}
            info=$(curl --proto '=https' --tlsv1.2 -sSf --retry 3 "https://api.steamcmd.net/v1/info/$app")
            build=$(jq -r --arg app "$app" '.data[$app].depots.branches.public.buildid // empty' <<< "$info")
            case "$build" in
              '' | *[!0-9]*) echo "::error::no public build id for app $app"; exit 1 ;;
            esac
            table=false
            grep -qx "steam_build = $build" "$TABLES/$side"-*.toml 2> /dev/null && table=true
            if [ "$side" = server ]; then
              manifest=$(jq -r '.data["2278520"].depots["2278521"].manifests.public.gid // empty' <<< "$info")
              {
                echo "server-build=$build"
                echo "server-manifest=$manifest"
                echo "server-has-table=$table"
              } >> "$GITHUB_OUTPUT"
            fi
            if [ "$table" = true ]; then
              echo "$side build $build has a table"
              continue
            fi
            title="Game $side build $build has no build table"
            open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "\"$title\" in:title" \
              --json number --jq length)
            if [ "$open" != 0 ]; then
              echo "$side build $build: an issue exists"
              continue
            fi
            updated=$(jq -r --arg app "$app" '.data[$app].depots.branches.public.timeupdated // empty' <<< "$info")
            {
              echo "Steam's public branch of the Enshrouded $side (app $app) is at build $build"
              [ -z "$updated" ] || echo "since $(date -u -d "@$updated" '+%F %H:%M') UTC"
              echo "and no build table names it. Until one does, the loader runs this build on"
              echo "the code patterns of the newest table, and what they miss stays off."
              if [ "$side" = client ]; then
                echo
                echo "The client's executable downloads only with a Steam account that owns the"
                echo "game, which this watch does not have yet, so no pull request follows."
              fi
              echo
              echo "Port the table with \`cargo enshwick pin\` against the previous build's"
              echo "executable, as [its README](https://github.com/$GITHUB_REPOSITORY/blob/main/crates/cargo-enshwick/README.md#porting-build-rows-pin)"
              echo "describes, and open a pull request with it. Never commit game files."
            } > "$RUNNER_TEMP/body.md"
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --label game-update --body-file "$RUNNER_TEMP/body.md"
          done

  # A new server build: its executable next to the previous one on the
  # runners' volume, `cargo enshwick pin` from one to the other, the compat
  # report of the new table on the new executable, and a pull request with
  # both. It merges on its own when the tool proved every entry and every
  # loader feature has what it needs; otherwise it waits for a person. While
  # the build has a table, the job only keeps its executable for the next
  # update. The executables never leave the volume. The client needs a Steam
  # account that owns the game and stays with the issue.
  server-pin:
    needs: watch
    # A build without a table, or, to keep the executable of the current
    # tabled build (say a person wrote its table), a run by hand or the
    # tick in the 03:00 UTC hour (a no-op once the file is kept).
    if: >-
      inputs.pin && needs.watch.outputs.server-build != ''
      && (needs.watch.outputs.server-has-table != 'true' || needs.watch.outputs.seed == 'true' || inputs.rehearse)
    runs-on: enshwick
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      BUILD: ${{ needs.watch.outputs.server-build }}
      MANIFEST: ${{ needs.watch.outputs.server-manifest }}
      # A rehearsal works as if the build had no table, and pushes nothing.
      HAS_TABLE: ${{ !inputs.rehearse && needs.watch.outputs.server-has-table }}
      REHEARSE: ${{ inputs.rehearse }}
      TABLES: ${{ inputs.tables }}
      GAME: /ci-cache/game/server
      DEPOTDOWNLOADER_VERSION: 3.4.0
      DEPOTDOWNLOADER_SHA256: a999dec66b4850fc961bd50366696d23c2d0fad7b18790e6a5647b2f19097a53
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: enshwick/.github
          ref: main
          path: .enshwick-ci
          persist-credentials: false

      - name: Executables
        id: exe
        run: |
          if ! mkdir -p "$GAME" 2> /dev/null || [ ! -w "$GAME" ]; then
            echo "::error::$GAME is not writable on this runner"
            exit 1
          fi
          tool="${RUNNER_TOOL_CACHE:-$HOME/.cache}/depotdownloader/$DEPOTDOWNLOADER_VERSION"
          if [ ! -x "$tool/DepotDownloader" ]; then
            curl --proto '=https' --tlsv1.2 -sSfL -o "$RUNNER_TEMP/dd.zip" \
              "https://github.com/SteamRE/DepotDownloader/releases/download/DepotDownloader_$DEPOTDOWNLOADER_VERSION/DepotDownloader-linux-x64.zip"
            echo "$DEPOTDOWNLOADER_SHA256  $RUNNER_TEMP/dd.zip" | sha256sum -c -
            mkdir -p "$tool"
            unzip -oq "$RUNNER_TEMP/dd.zip" DepotDownloader -d "$tool"
          fi
          # Only the server executable of the Windows depot, about 100 MB of
          # its 8 GB, from the exact manifest of the build.
          if [ ! -f "$GAME/$BUILD/enshrouded_server.exe" ]; then
            echo 'regex:^enshrouded_server\.exe$' > "$RUNNER_TEMP/files.txt"
            DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1 "$tool/DepotDownloader" \
              -app 2278520 -depot 2278521 -manifest "$MANIFEST" \
              -filelist "$RUNNER_TEMP/files.txt" -dir "$RUNNER_TEMP/download"
            mkdir -p "$GAME/$BUILD.tmp"
            find "$RUNNER_TEMP/download" -name enshrouded_server.exe -exec mv {} "$GAME/$BUILD.tmp/" \;
            test -f "$GAME/$BUILD.tmp/enshrouded_server.exe"
            mv "$GAME/$BUILD.tmp" "$GAME/$BUILD"
          fi
          # The newest build before this one whose table exists.
          old=""
          for dir in $(find "$GAME" -mindepth 1 -maxdepth 1 -type d -name '[0-9]*' -printf '%f\n' | sort -n); do
            [ "$dir" -lt "$BUILD" ] || continue
            grep -qx "steam_build = $dir" "$TABLES"/server-*.toml 2> /dev/null && old=$dir
          done
          # A rehearsal ports the build from itself.
          if [ "$REHEARSE" = true ]; then old=$BUILD; fi
          echo "old=$old" >> "$GITHUB_OUTPUT"
          # Three builds are enough to port from.
          find "$GAME" -mindepth 1 -maxdepth 1 -type d -name '[0-9]*' -printf '%f\n' | sort -n | head -n -3 \
            | while read -r dir; do rm -rf "${GAME:?}/$dir"; done
          du -sh "$GAME"

      - if: env.HAS_TABLE != 'true' && steps.exe.outputs.old == ''
        run: echo "::warning::no earlier server executable is kept; the issue stays for a person"

      # Wine runs the compat report, which needs the loader's Windows build.
      - if: env.HAS_TABLE != 'true' && steps.exe.outputs.old != ''
        uses: ./.enshwick-ci/.github/actions/setup-rust # zizmor: ignore[self-repository]
        with:
          wine: true

      - name: cargo enshwick pin
        id: pin
        if: env.HAS_TABLE != 'true' && steps.exe.outputs.old != ''
        env:
          OLD: ${{ steps.exe.outputs.old }}
        run: |
          status=0
          write=(--write)
          if [ "$REHEARSE" = true ]; then write=(); fi
          cargo run --release -q -p cargo-enshwick -- enshwick pin \
            --old "$GAME/$OLD/enshrouded_server.exe" --new "$GAME/$BUILD/enshrouded_server.exe" \
            --steam-build "$BUILD" "${write[@]}" --report "$RUNNER_TEMP/pin.md" || status=$?
          case "$status" in
            0) echo "complete=true" >> "$GITHUB_OUTPUT" ;;
            2) echo "complete=false" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac
          git status --short

      # Which loader features the new table carries on the new executable:
      # the loader's Windows build, with the table just written embedded,
      # under Wine. A report that cannot be made keeps the pull request for
      # a person instead of failing the job.
      - name: cargo xtask compat
        id: compat
        if: steps.pin.outcome == 'success'
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUNNER: wine
        run: |
          status=0
          cargo xwin run --release -q --target x86_64-pc-windows-msvc -p xtask --features compat -- \
            compat "$GAME/$BUILD/enshrouded_server.exe" --report "$RUNNER_TEMP/compat.md" || status=$?
          case "$status" in
            0) works=true ;;
            2) works=false ;;
            *)
              works=unknown
              echo "::warning::the compat report failed with exit code $status"
              echo "The compat report could not be made (exit code $status); see the run's log." > "$RUNNER_TEMP/compat.md"
              ;;
          esac
          echo "works=$works" >> "$GITHUB_OUTPUT"

      - name: Mint the enshwick-ci token
        id: token
        if: steps.pin.outcome == 'success' && env.REHEARSE != 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.ENSHWICK_CI_CLIENT_ID }}
          private-key: ${{ secrets.ENSHWICK_CI_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      # Opened with the app, so CI runs on it. A rehearsal shows the body in
      # the run summary and pushes nothing.
      - name: Pull request
        if: steps.pin.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          COMPLETE: ${{ steps.pin.outputs.complete }}
          WORKS: ${{ steps.compat.outputs.works }}
          OLD: ${{ steps.exe.outputs.old }}
        run: |
          branch="game/server-$BUILD"
          if [ "$REHEARSE" != true ] &&
            [ "$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state all --json number --jq length)" != 0 ]; then
            echo "a pull request for $branch exists"
            exit 0
          fi
          issue=""
          if [ "$REHEARSE" != true ]; then
            title="Game server build $BUILD has no build table"
            issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" \
              --json number --jq '.[0].number // empty')
          fi
          automerge=false
          if [ "$COMPLETE" = true ] && [ "$WORKS" = true ]; then automerge=true; fi
          {
            echo "## Features"
            echo
            echo "- Added the build table of server build $BUILD, ported by \`cargo enshwick pin\` from build $OLD."
            if [ "$COMPLETE" != true ]; then
              echo "- Some entries need a person (pin report below); this waits for a review."
            fi
            case "$WORKS" in
              true) echo "- Every loader feature has what it needs on this build (compat report below)." ;;
              false) echo "- Some loader features stay off on this build (compat report below); this waits for a review." ;;
              *) echo "- The compat report could not be made; this waits for a review." ;;
            esac
            if [ "$automerge" = true ]; then
              echo "- Merges on its own once CI passes."
            fi
            [ -z "$issue" ] || { echo; echo "Closes #$issue"; }
            echo
            echo "<details><summary>pin report</summary>"
            echo
            cat "$RUNNER_TEMP/pin.md"
            echo
            echo "</details>"
            echo
            echo "<details><summary>compat report</summary>"
            echo
            cat "$RUNNER_TEMP/compat.md"
            echo
            echo "</details>"
          } > "$RUNNER_TEMP/body.md"
          if [ "$REHEARSE" = true ]; then
            {
              echo "Rehearsal: the pull request \`feat(gamedata): build table of server build $BUILD\` would read"
              echo "(auto-merge: $automerge):"
              echo
              cat "$RUNNER_TEMP/body.md"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git switch -c "$branch"
          paths=("$TABLES")
          [ ! -d mods ] || paths+=(mods)
          git add -A -- "${paths[@]}"
          git -c user.name="enshwick-ci[bot]" \
            -c user.email="347820590+enshwick-ci[bot]@users.noreply.github.com" \
            commit -q -m "feat(gamedata): build table of server build $BUILD"
          git push -q "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$branch"
          url=$(gh pr create --repo "$GITHUB_REPOSITORY" --head "$branch" \
            --title "feat(gamedata): build table of server build $BUILD" --body-file "$RUNNER_TEMP/body.md")
          echo "$url"
          if [ "$automerge" = true ]; then gh pr merge "$url" --auto --squash; fi
