name: Rust CI

# `cargo xtask check` for a pull request, a merge queue entry, a push to main
# or the nightly run. Pull requests, pushes and the nightly run use
# GitHub-hosted runners, with the toolchain, the Windows SDK and the build
# cached between runs. With `split` the check runs as parallel jobs: the
# host check and the Windows lint on hosted runners, and the Windows tests
# natively on the owner's PC when it is online or else under Wine on the
# organization runners outside pull requests. The job `check` sums them up
# and is the required check.

on:
  workflow_call:
    inputs:
      full:
        description: Run the full suite instead of the packages a change touches.
        type: boolean
        default: false
      windows-tests:
        description: Run the Windows-only crates' tests under Wine.
        type: boolean
        default: true
      split:
        description: Run the host check, the Windows lint and the Windows tests as parallel jobs; the repository's `cargo xtask check` must know `--part`.
        type: boolean
        default: false
      semver:
        description: Packages checked with cargo-semver-checks against their last release on crates.io, space-separated; none when empty.
        type: string
        default: ""
    secrets:
      ENSHWICK_CI_CLIENT_ID:
        description: The enshwick-ci app, which tells whether the owner's Windows runners are online.
        required: false
      ENSHWICK_CI_PRIVATE_KEY:
        description: The enshwick-ci app's private key.
        required: false

permissions: {}

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.scope.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: enshwick/.github
          ref: main
          path: .enshwick-ci
          persist-credentials: false

      # The shared configuration stays as template-mod rendered it, and
      # renovate.json only extends the shared preset.
      - name: Shared configuration
        run: |
          git clone -q https://github.com/enshwick/template-mod "$RUNNER_TEMP/template-mod"
          .enshwick-ci/scripts/config-drift.sh . "$RUNNER_TEMP/template-mod"

      # Work already proven is not repeated: a merge queue group whose tree
      # is its pull request's own head passed that pull request's check,
      # and a change to files that never build (documents outside the book,
      # repository settings, workflows) has nothing to compile or test.
      - name: What is left to prove
        id: scope
        env:
          # A merge queue entry is checked against the entry before it (its
          # group's parent): only its own pull request's changes are new.
          BASE: ${{ github.event.merge_group.base_sha || format('origin/{0}', github.base_ref || github.event.repository.default_branch) }}
          EVENT: ${{ github.event_name }}
          FULL: ${{ inputs.full || (github.event_name != 'pull_request' && github.event_name != 'merge_group') }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git cat-file -e "$BASE^{commit}" 2> /dev/null || git fetch -q origin "$BASE"
          reason=""
          if [ "$EVENT" = merge_group ]; then
            number=$(sed -nE 's|.*/pr-([0-9]+)-[0-9a-f]+$|\1|p' <<< "$HEAD_REF")
            if [ -n "$number" ]; then
              head=$(curl --proto '=https' -sSf -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$number" | jq -r .head.sha)
              git fetch -q origin "$head"
              if [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "$head^{tree}")" ]; then
                reason="the group's tree is pull request #$number's head, whose check passed"
              fi
            fi
          fi
          if [ -z "$reason" ] && [ "$FULL" != true ]; then
            never='^(\.github/|[^/]+\.md$|(.*/)?CHANGELOG\.md$|LICENSE$|\.gitignore$|\.gitattributes$|renovate\.json$|_typos\.toml$|\.markdownlint-cli2\.yaml$|lefthook\.yml$|committed\.toml$|release-plz\.toml$|\.copier-answers\.yml$|package\.json$|bun\.lock$)'
            if ! git diff --name-only "$BASE...HEAD" | grep -qvE "$never"; then
              reason="no file that builds changed"
            fi
          fi
          if [ -n "$reason" ]; then
            echo "nothing to check: $reason" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "skip=$reason" >> "$GITHUB_OUTPUT"

  part:
    needs: scope
    if: needs.scope.outputs.skip == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(inputs.split && '["host", "windows-lint"]' || '["all"]') }}
    env:
      # A merge queue entry is checked against the entry before it (its
      # group's parent): only its own pull request's changes are new.
      BASE: ${{ github.event.merge_group.base_sha || format('origin/{0}', github.base_ref || github.event.repository.default_branch) }}
      FULL: ${{ inputs.full || (github.event_name != 'pull_request' && github.event_name != 'merge_group') }}
      PART: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Checked out and used by path: the organization refuses actions not
      # pinned by SHA, and actionlint cannot read the `$/` form yet. From
      # main, the only ref the runners run workflows from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: enshwick/.github
          ref: main
          path: .enshwick-ci
          persist-credentials: false

      - name: Fetch the base
        run: git cat-file -e "$BASE^{commit}" 2> /dev/null || git fetch -q origin "$BASE"

      # On a GitHub-hosted runner nothing persists between jobs: the
      # toolchain, the Windows SDK and the Wine packages come from the cache.
      - if: runner.environment == 'github-hosted'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.tool_cache }}/rustup
          key: rustup-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      # The Windows SDK and CRT cargo-xwin downloads, about 12 minutes from
      # Microsoft on a hosted runner; only the Windows parts fill it.
      - if: runner.environment == 'github-hosted' && matrix.part != 'host'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.tool_cache }}/xwin
          key: xwin-${{ runner.os }}-0.23.1-v1
      - if: runner.environment == 'github-hosted' && matrix.part != 'host'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.tool_cache }}/apt-archives
          key: apt-${{ runner.os }}-${{ matrix.part }}-v1

      - uses: ./.enshwick-ci/.github/actions/setup-rust # zizmor: ignore[self-repository]
        with:
          tools: cargo-nextest@0.9.149,cargo-deny@0.20.2${{ inputs.semver != '' && matrix.part != 'windows-lint' && ',cargo-semver-checks@0.51.0' || '' }}
          wine: ${{ matrix.part == 'all' && inputs.windows-tests }}

      # The build itself, per part: each job builds a different target.
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # A cache saved by a failed run would be restored as it is and
          # never replaced, so only a finished run saves one.
          prefix-key: v1-rust
          key: ${{ matrix.part }}

      - name: cargo xtask check
        env:
          WINDOWS: ${{ inputs.windows-tests }}
        run: |
          args=()
          if [ "$FULL" = true ]; then args+=(--all); else args+=(--base "$BASE"); fi
          if [ "$PART" = all ]; then
            if [ "$WINDOWS" = true ]; then args+=(--windows); fi
          else
            args+=(--part "$PART")
          fi
          if [ "$PART" = all ] || [ "$PART" = host ]; then cargo fmt --all --check; fi
          cargo xtask check "${args[@]}"

      # A version that claims less change than the public API made fails;
      # unreleased changes keep the released version and pass.
      - name: cargo semver-checks
        if: inputs.semver != '' && (matrix.part == 'all' || matrix.part == 'host')
        env:
          PACKAGES: ${{ inputs.semver }}
        run: |
          args=()
          for package in $PACKAGES; do args+=(--package "$package"); done
          cargo semver-checks "${args[@]}"

      - name: sccache statistics
        if: always() && env.RUSTC_WRAPPER == 'sccache'
        run: command -v sccache > /dev/null && sccache --show-stats || true

  # The Windows tests (with `split`) run natively on the owner's PC when one
  # of its runners is online, and otherwise, or when the native run failed,
  # under Wine on the organization runners outside pull requests: under Wine
  # one loader test depends on the CPU and fails on GitHub's machines.
  windows-gate:
    needs: scope
    if: inputs.split && needs.scope.outputs.skip == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions: {}
    outputs:
      native: ${{ steps.online.outputs.native }}
    env:
      HAS_APP: ${{ secrets.ENSHWICK_CI_CLIENT_ID != '' }}
    steps:
      - name: Mint the enshwick-ci token
        id: token
        if: env.HAS_APP == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.ENSHWICK_CI_CLIENT_ID }}
          private-key: ${{ secrets.ENSHWICK_CI_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-organization-self-hosted-runners: read
      - name: Is a PC runner online
        id: online
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          count=0
          if [ -n "$GH_TOKEN" ]; then
            count=$(gh api --paginate "orgs/$GITHUB_REPOSITORY_OWNER/actions/runners" --jq \
              '.runners[] | select(.status == "online") | select([.labels[].name] | index("enshwick-pc")) | .name' |
              wc -l) || count=0
          fi
          echo "PC runners online: $count"
          if [ "$count" -gt 0 ]; then echo "native=true"; else echo "native=false"; fi >> "$GITHUB_OUTPUT"

  windows-native:
    needs: [scope, windows-gate]
    if: needs.windows-gate.outputs.native == 'true'
    runs-on: [self-hosted, Windows, X64, enshwick-pc]
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      BASE: ${{ github.event.merge_group.base_sha || format('origin/{0}', github.base_ref || github.event.repository.default_branch) }}
      FULL: ${{ inputs.full || (github.event_name != 'pull_request' && github.event_name != 'merge_group') }}
      # Ten runners share one 16-core PC that is also the owner's.
      CARGO_BUILD_JOBS: "3"
    steps:
      - name: Long paths
        run: git config --global core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: enshwick/.github
          ref: main
          path: .enshwick-ci
          persist-credentials: false

      - name: Fetch the base
        run: git cat-file -e "$BASE^{commit}" 2> /dev/null || git fetch -q origin "$BASE"

      - uses: ./.enshwick-ci/.github/actions/setup-rust-windows # zizmor: ignore[self-repository]

      # cargo-xwin's environment, then plain cargo: the tests run natively
      # (no runner) and cargo's exit status reaches the job. One test thread,
      # as under Wine: the hook and patch tests share the process.
      - name: Windows tests
        run: |
          # Its PATH is in Windows form and would hide bash's tools.
          eval "$(cargo xwin env --target x86_64-pc-windows-msvc | grep -v '^export PATH=')"
          unset CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUNNER
          args=()
          if [ "$FULL" = true ]; then args+=(--all); else args+=(--base "$BASE"); fi
          tests=$(cargo run --quiet --target x86_64-pc-windows-msvc -p xtask -- \
            check "${args[@]}" --list-windows-tests | xargs)
          echo "Windows tests: ${tests:-none}"
          [ -n "$tests" ] || exit 0
          packages=()
          for package in $tests; do packages+=(-p "$package"); done
          status=0
          cargo test --target x86_64-pc-windows-msvc "${packages[@]}" -- --test-threads 1 || status=$?
          if [ "$status" != 0 ]; then
            # A crash takes the harness's buffered output with it: run the
            # library tests one by one to name the ones that crash.
            echo "::group::Each test alone"
            cargo test --quiet --target x86_64-pc-windows-msvc "${packages[@]}" --lib -- --list --format terse |
              sed -n 's/: test$//p' > "$RUNNER_TEMP/tests.txt"
            exe=$(cargo test --no-run --message-format json --target x86_64-pc-windows-msvc "${packages[@]}" --lib |
              jq -r 'select(.profile.test == true and .target.kind[0] == "lib") | .executable' | head -1)
            while read -r name; do
              "$exe" --exact "$name" --test-threads 1 > /dev/null 2>&1 || echo "::error::crashed or failed alone: $name"
            done < "$RUNNER_TEMP/tests.txt"
            echo "::endgroup::"
          fi
          exit "$status"

      # The work tree's build output goes; the shared caches stay.
      - name: Clean up
        if: always()
        run: rm -rf target

  windows-wine:
    needs: [scope, windows-gate, windows-native]
    if: >-
      always() && inputs.split && needs.scope.outputs.skip == '' && github.event_name != 'pull_request'
      && (needs.windows-gate.outputs.native != 'true' || needs.windows-native.result == 'failure')
    runs-on: enshwick
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      BASE: ${{ github.event.merge_group.base_sha || format('origin/{0}', github.base_ref || github.event.repository.default_branch) }}
      FULL: ${{ inputs.full || (github.event_name != 'pull_request' && github.event_name != 'merge_group') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: enshwick/.github
          ref: main
          path: .enshwick-ci
          persist-credentials: false

      - name: Fetch the base
        run: git cat-file -e "$BASE^{commit}" 2> /dev/null || git fetch -q origin "$BASE"

      - uses: ./.enshwick-ci/.github/actions/setup-rust # zizmor: ignore[self-repository]
        with:
          tools: cargo-nextest@0.9.149

      - name: Windows tests to run
        id: list
        run: |
          args=()
          if [ "$FULL" = true ]; then args+=(--all); else args+=(--base "$BASE"); fi
          tests=$(cargo xtask check "${args[@]}" --list-windows-tests | xargs)
          echo "Windows tests: ${tests:-none}"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
      - if: steps.list.outputs.tests != ''
        uses: ./.enshwick-ci/.github/actions/setup-rust # zizmor: ignore[self-repository]
        with:
          wine: true
      - name: Windows tests under Wine
        if: steps.list.outputs.tests != ''
        run: |
          args=()
          if [ "$FULL" = true ]; then args+=(--all); else args+=(--base "$BASE"); fi
          cargo xtask check "${args[@]}" --part windows-tests

  # The required check: every part passed, or there was nothing to prove.
  check:
    needs: [scope, part, windows-gate, windows-native, windows-wine]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Result
        env:
          SCOPE: ${{ needs.scope.result }}
          PART: ${{ needs.part.result }}
          GATE: ${{ needs.windows-gate.result }}
          NATIVE: ${{ needs.windows-native.result }}
          WINE: ${{ needs.windows-wine.result }}
        run: |
          echo "scope: $SCOPE, parts: $PART, Windows gate: $GATE, native: $NATIVE, Wine: $WINE"
          ok() { [ "$1" = success ] || [ "$1" = skipped ]; }
          # The Windows tests passed on one path, or neither had to run.
          windows=false
          if [ "$NATIVE" = success ] || [ "$WINE" = success ]; then windows=true; fi
          if [ "$NATIVE" = skipped ] && [ "$WINE" = skipped ]; then windows=true; fi
          [ "$SCOPE" = success ] && ok "$PART" && ok "$GATE" && [ "$windows" = true ]
