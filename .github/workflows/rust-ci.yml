name: Rust CI

on:
  workflow_call:
    inputs:
      full:
        description: Run the full suite instead of the packages a change touches.
        type: boolean
        default: false
      windows-tests:
        description: Run the Windows-only crates' tests under Wine.
        type: boolean
        default: true
      semver:
        description: Packages checked with cargo-semver-checks against their last release on crates.io, space-separated; none when empty.
        type: string
        default: ""

permissions: {}

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: enshwick
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Checked out and used by path: the organization refuses actions not
      # pinned by SHA, and actionlint cannot read the `$/` form yet. From
      # main, the only ref the runners run workflows from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: enshwick/.github
          ref: main
          path: .enshwick-ci
          persist-credentials: false

      # The shared configuration stays as template-mod rendered it, and
      # renovate.json only extends the shared preset.
      - name: Shared configuration
        run: |
          git clone -q https://github.com/enshwick/template-mod "$RUNNER_TEMP/template-mod"
          .enshwick-ci/scripts/config-drift.sh . "$RUNNER_TEMP/template-mod"

      # Work already proven is not repeated: a merge queue group whose tree
      # is its pull request's own head passed that pull request's check,
      # and a change to files that never build (documents outside the book,
      # repository settings, workflows) has nothing to compile or test.
      - name: What is left to prove
        id: scope
        env:
          BASE: origin/${{ github.base_ref || github.event.repository.default_branch }}
          EVENT: ${{ github.event_name }}
          FULL: ${{ inputs.full || (github.event_name != 'pull_request' && github.event_name != 'merge_group') }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          reason=""
          if [ "$EVENT" = merge_group ]; then
            number=$(sed -nE 's|.*/pr-([0-9]+)-[0-9a-f]+$|\1|p' <<< "$HEAD_REF")
            if [ -n "$number" ]; then
              head=$(curl --proto '=https' -sSf -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$number" | jq -r .head.sha)
              git fetch -q origin "$head"
              if [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "$head^{tree}")" ]; then
                reason="the group's tree is pull request #$number's head, whose check passed"
              fi
            fi
          fi
          if [ -z "$reason" ] && [ "$FULL" != true ]; then
            never='^(\.github/|[^/]+\.md$|(.*/)?CHANGELOG\.md$|LICENSE$|\.gitignore$|\.gitattributes$|renovate\.json$|_typos\.toml$|\.markdownlint-cli2\.yaml$|lefthook\.yml$|committed\.toml$|release-plz\.toml$|\.copier-answers\.yml$|package\.json$|bun\.lock$)'
            if ! git diff --name-only "$BASE...HEAD" | grep -qvE "$never"; then
              reason="no file that builds changed"
            fi
          fi
          if [ -n "$reason" ]; then
            echo "nothing to check: $reason" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "skip=$reason" >> "$GITHUB_OUTPUT"

      - if: steps.scope.outputs.skip == ''
        uses: ./.enshwick-ci/.github/actions/setup-rust # zizmor: ignore[self-repository]
        with:
          tools: cargo-nextest@0.9.149,cargo-deny@0.20.2${{ inputs.semver != '' && ',cargo-semver-checks@0.51.0' || '' }}
          wine: ${{ inputs.windows-tests }}

      - name: cargo xtask check
        if: steps.scope.outputs.skip == ''
        env:
          BASE: origin/${{ github.base_ref || github.event.repository.default_branch }}
          # A merge queue group gets the fast lane too: the changes of its
          # pull requests on top of main.
          FULL: ${{ inputs.full || (github.event_name != 'pull_request' && github.event_name != 'merge_group') }}
          WINDOWS: ${{ inputs.windows-tests }}
        run: |
          args=()
          if [ "$FULL" = true ]; then args+=(--all); else args+=(--base "$BASE"); fi
          if [ "$WINDOWS" = true ]; then args+=(--windows); fi
          cargo fmt --all --check
          cargo xtask check "${args[@]}"

      # A version that claims less change than the public API made fails;
      # unreleased changes keep the released version and pass.
      - name: cargo semver-checks
        if: steps.scope.outputs.skip == '' && inputs.semver != ''
        env:
          PACKAGES: ${{ inputs.semver }}
        run: |
          args=()
          for package in $PACKAGES; do args+=(--package "$package"); done
          cargo semver-checks "${args[@]}"

      - name: sccache statistics
        if: always() && env.RUSTC_WRAPPER == 'sccache'
        run: command -v sccache > /dev/null && sccache --show-stats || true
