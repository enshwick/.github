name: Rust nightly

# The checks too slow for a pull request, once a night on GitHub's runners:
# Miri on the packages a repository names, unused dependencies, coverage,
# external links, benchmarks against the last passing night and, where a
# repository asks, its fuzz targets, loom models, Kani proofs and tests under
# AddressSanitizer. Each part is a job of its own with its own time limit,
# all in parallel, so a part that runs out of memory or time takes no other
# part with it. The `nightly` job at the end fails when any part failed; a
# repository's gate looks for that job by name. Packages that build only for
# Windows (`[package.metadata.enshwick] windows-only = true`) stay out: these
# checks run on the Linux host.

on:
  workflow_call:
    inputs:
      miri:
        description: Packages whose library tests run under Miri, space-separated; none when empty.
        type: string
        default: ""
      links:
        description: Check the external links in the Markdown files with lychee.
        type: boolean
        default: true
      fuzz:
        description: Run every cargo-fuzz target in fuzz/, from the corpus of the nights before and the seeds in fuzz/corpus/<target>.
        type: boolean
        default: false
      fuzz-seconds:
        description: How long each fuzz target runs.
        type: number
        default: 120
      loom:
        description: cargo test arguments for the loom models, built with `--cfg loom`, such as `-p a-crate --test loom_chains`; none when empty.
        type: string
        default: ""
      kani:
        description: cargo kani arguments, one run per line, such as `-p a-crate --lib --tests --harness proofs`; none when empty.
        type: string
        default: ""
      asan:
        description: cargo nextest run arguments for the tests to run under AddressSanitizer, such as `-p a-crate --lib`; none when empty.
        type: string
        default: ""
      bench-args:
        description: Extra cargo bench arguments, such as `--features a-crate/test` for benches that need a feature.
        type: string
        default: ""
      bench-regression:
        description: Fail when a benchmark got slower than the last passing night by more than this percent, at the low end of criterion's confidence interval; 0 turns the check off.
        type: number
        default: 25

permissions: {}

env:
  NIGHTLY: nightly-2026-10-29

jobs:
  miri:
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && inputs.miri != '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Checked out and used by path, as in rust-ci.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: enshwick/.github
          ref: main
          path: .enshwick-ci
          persist-credentials: false
      - uses: ./.enshwick-ci/.github/actions/setup-rust # zizmor: ignore[self-repository]

      - name: Miri
        env:
          PACKAGES: ${{ inputs.miri }}
          # Tests that read fixtures from disk need the file system.
          MIRIFLAGS: -Zmiri-disable-isolation
        run: |
          flock "$RUSTUP_HOME.lock" rustup toolchain install "$NIGHTLY" \
            --profile minimal --component miri,rust-src
          args=()
          for package in $PACKAGES; do args+=(-p "$package"); done
          cargo "+$NIGHTLY" miri test --lib "${args[@]}"

  udeps-coverage:
    name: unused dependencies and coverage
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: enshwick/.github
          ref: main
          path: .enshwick-ci
          persist-credentials: false
      - uses: ./.enshwick-ci/.github/actions/setup-rust # zizmor: ignore[self-repository]
        with:
          # cargo-nextest 0.9.150 (2026-10-26) is not yet in install-action's manifests.
          tools: cargo-nextest@0.9.149,cargo-udeps@0.1.61,cargo-llvm-cov@0.9.1

      - name: The packages to check
        id: scope
        run: |
          excludes=$(cargo metadata --no-deps --format-version 1 | jq -r '
            [.packages[] | select(.metadata.enshwick["windows-only"] == true) | "--exclude " + .name]
            | join(" ")')
          hosted=$(cargo metadata --no-deps --format-version 1 | jq '
            [.packages[] | select(.metadata.enshwick["windows-only"] != true)] | length')
          {
            echo "excludes=$excludes"
            echo "hosted=$hosted"
          } >> "$GITHUB_OUTPUT"

      - name: Unused dependencies
        if: steps.scope.outputs.hosted != '0'
        env:
          EXCLUDES: ${{ steps.scope.outputs.excludes }}
        run: |
          flock "$RUSTUP_HOME.lock" rustup toolchain install "$NIGHTLY" --profile minimal
          # shellcheck disable=SC2086 # one word per flag
          cargo "+$NIGHTLY" udeps --workspace $EXCLUDES --all-targets

      - name: Coverage
        if: ${{ !cancelled() && steps.scope.outputs.hosted != '0' }}
        env:
          EXCLUDES: ${{ steps.scope.outputs.excludes }}
        run: |
          # shellcheck disable=SC2086 # one word per flag
          cargo llvm-cov nextest --workspace $EXCLUDES --no-tests=pass \
            --summary-only | tee "$RUNNER_TEMP/coverage.txt"
          {
            echo '## Coverage'
            echo
            echo '```text'
            cat "$RUNNER_TEMP/coverage.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  benchmarks:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: enshwick/.github
          ref: main
          path: .enshwick-ci
          persist-credentials: false
      - uses: ./.enshwick-ci/.github/actions/setup-rust # zizmor: ignore[self-repository]

      - name: The benchmarks to run
        id: scope
        run: |
          excludes=$(cargo metadata --no-deps --format-version 1 | jq -r '
            [.packages[] | select(.metadata.enshwick["windows-only"] == true) | "--exclude " + .name]
            | join(" ")')
          benches=$(cargo metadata --no-deps --format-version 1 | jq '
            [.packages[] | select(.metadata.enshwick["windows-only"] != true)
              | .targets[] | select(.kind | index("bench"))] | length')
          {
            echo "excludes=$excludes"
            echo "benches=$benches"
          } >> "$GITHUB_OUTPUT"

      # Hosted machines of one label run on several processor models, whose
      # timings differ by more than the regression threshold.
      - name: The processor model
        id: machine
        if: steps.scope.outputs.benches != '0' && inputs.bench-regression > 0
        run: |
          model=$(sed -n 's/^model name[[:space:]]*: //p' /proc/cpuinfo | head -n 1)
          echo "kind=$(printf '%s' "$model" | tr -cs '[:alnum:]' '-')" >> "$GITHUB_OUTPUT"

      # Criterion compares each run with the one before in target/criterion;
      # that one is the last night whose benchmarks passed the check on the
      # same processor model: a baseline from other hardware compares
      # nothing.
      - name: Restore the last passing benchmarks
        if: steps.scope.outputs.benches != '0' && inputs.bench-regression > 0
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/criterion
          key: criterion-hosted-${{ runner.os }}-${{ steps.machine.outputs.kind }}-${{ github.run_id }}
          restore-keys: criterion-hosted-${{ runner.os }}-${{ steps.machine.outputs.kind }}-

      - name: Benchmarks
        id: benches
        if: steps.scope.outputs.benches != '0'
        env:
          EXCLUDES: ${{ steps.scope.outputs.excludes }}
          ARGS: ${{ inputs.bench-args }}
        run: |
          # Only tonight's comparisons count, not those of a bench since removed.
          shopt -s globstar nullglob
          rm -rf target/criterion/**/change
          # shellcheck disable=SC2086 # one word per flag
          cargo bench --workspace $EXCLUDES $ARGS

      - name: Benchmark regressions
        id: regressions
        if: steps.benches.outcome == 'success' && inputs.bench-regression > 0
        env:
          PERCENT: ${{ inputs.bench-regression }}
        run: |
          shopt -s globstar nullglob
          slower=0
          {
            echo '## Benchmark changes'
            echo
            echo '| Benchmark | Change, low to high |'
            echo '| --- | --- |'
          } >> "$GITHUB_STEP_SUMMARY"
          for change in target/criterion/**/change/estimates.json; do
            name=${change#target/criterion/}
            name=${name%/change/estimates.json}
            read -r low high < <(jq -r '.mean.confidence_interval
              | "\(.lower_bound * 100 | round) \(.upper_bound * 100 | round)"' "$change")
            echo "| $name | ${low}% to ${high}% |" >> "$GITHUB_STEP_SUMMARY"
            if (( low > PERCENT )); then
              echo "::error::$name is ${low}% to ${high}% slower than the last passing night"
              slower=1
            fi
          done
          exit "$slower"

      - name: Keep these benchmarks for the next night
        if: steps.regressions.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/criterion
          key: criterion-hosted-${{ runner.os }}-${{ steps.machine.outputs.kind }}-${{ github.run_id }}

  loom-kani:
    name: loom and Kani
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (inputs.loom != '' || inputs.kani != '') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # Built from source; `cargo kani setup` fetches its own toolchain.
      KANI: 0.68.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: enshwick/.github
          ref: main
          path: .enshwick-ci
          persist-credentials: false
      - uses: ./.enshwick-ci/.github/actions/setup-rust # zizmor: ignore[self-repository]

      # Release builds: a model run in debug takes many times as long.
      - name: Loom models
        if: inputs.loom != ''
        env:
          ARGS: ${{ inputs.loom }}
          RUSTFLAGS: --cfg loom
        run: |
          # shellcheck disable=SC2086 # one word per argument
          cargo test --release --target-dir target/loom $ARGS

      - name: Kani proofs
        if: ${{ !cancelled() && inputs.kani != '' }}
        env:
          RUNS: ${{ inputs.kani }}
        run: |
          export KANI_HOME="${RUNNER_TOOL_CACHE:-$HOME/.cache}/kani"
          # CBMC preprocesses its C models with `gcc -E`; a runner with
          # clang alone takes it under that name, with the same flags.
          if ! command -v gcc > /dev/null; then
            mkdir -p "$RUNNER_TEMP/kani-bin"
            ln -sf "$(command -v clang)" "$RUNNER_TEMP/kani-bin/gcc"
            export PATH="$RUNNER_TEMP/kani-bin:$PATH"
          fi
          if ! cargo kani --version 2> /dev/null | grep -q " $KANI "; then
            flock "$CARGO_HOME.lock" cargo install --locked "kani-verifier@$KANI"
          fi
          if [ ! -d "$KANI_HOME/kani-$KANI" ]; then
            flock "$KANI_HOME.lock" cargo kani setup
          fi
          failed=0
          while IFS= read -r args; do
            [ -n "$args" ] || continue
            # shellcheck disable=SC2086 # one word per argument
            cargo kani --target-dir target/kani $args || failed=1
          done <<< "$RUNS"
          exit "$failed"

  asan:
    name: AddressSanitizer
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && inputs.asan != '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: enshwick/.github
          ref: main
          path: .enshwick-ci
          persist-credentials: false
      - uses: ./.enshwick-ci/.github/actions/setup-rust # zizmor: ignore[self-repository]
        with:
          tools: cargo-nextest@0.9.149
          # Dependencies' C and C++ build under the sanitizer too.
          sanitizers: true

      # The host target named, so build scripts and proc macros stay
      # uninstrumented.
      - name: AddressSanitizer
        env:
          ARGS: ${{ inputs.asan }}
          RUSTFLAGS: -Zsanitizer=address
          # Memory errors only: memory handed across the C ABI and a fake
          # loader's earlier mod lives are never freed on purpose, which
          # LeakSanitizer reports as leaks.
          ASAN_OPTIONS: detect_leaks=0
        run: |
          flock "$RUSTUP_HOME.lock" rustup toolchain install "$NIGHTLY" --profile minimal
          host=$(rustc -vV | sed -n 's/^host: //p')
          # Leak and error reports name functions only with a symbolizer;
          # clang's LLVM brings one.
          symbolizer=$(compgen -G '/usr/lib/llvm-*/bin/llvm-symbolizer' | sort -V | tail -n 1 || true)
          if [ -n "$symbolizer" ]; then export ASAN_SYMBOLIZER_PATH="$symbolizer"; fi
          # nextest runs each test in a process of its own, as the merge
          # gate does: tests that keep a mod's state in a static rely on it.
          # shellcheck disable=SC2086 # one word per argument
          cargo "+$NIGHTLY" nextest run --no-fail-fast --target "$host" --target-dir target/asan $ARGS

  fuzz:
    name: fuzzing
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && inputs.fuzz }}
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      # Built from source: install-action has no prebuilt cargo-fuzz.
      CARGO_FUZZ: 0.13.2
      # Under target/, which no check reads.
      CORPUS: ${{ github.workspace }}/target/fuzz-corpus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: enshwick/.github
          ref: main
          path: .enshwick-ci
          persist-credentials: false
      - uses: ./.enshwick-ci/.github/actions/setup-rust # zizmor: ignore[self-repository]
        with:
          # Fuzz builds compile dependencies' C and C++ under the sanitizer.
          sanitizers: true

      # What the nights before found, a directory per target. The committed
      # corpus is the seeds; this one only grows and is minimised each night.
      - name: Restore the corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CORPUS }}
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      # A crash fails the step and keeps its input as an artifact.
      - name: Fuzzing
        env:
          SECONDS_PER_TARGET: ${{ inputs.fuzz-seconds }}
        run: |
          flock "$RUSTUP_HOME.lock" rustup toolchain install "$NIGHTLY" \
            --profile minimal --component rust-src
          if ! cargo fuzz --version 2> /dev/null | grep -q " $CARGO_FUZZ\$"; then
            flock "$CARGO_HOME.lock" cargo install --locked "cargo-fuzz@$CARGO_FUZZ"
          fi
          mkdir -p "$RUNNER_TEMP/fuzz-artifacts"
          failed=()
          for target in $(cargo "+$NIGHTLY" fuzz list); do
            found="$CORPUS/$target"
            mkdir -p "$found"
            cargo "+$NIGHTLY" fuzz run -O --target-dir target/fuzz "$target" \
              "$found" "fuzz/corpus/$target" -- \
              -max_total_time="$SECONDS_PER_TARGET" -rss_limit_mb=2048 \
              -artifact_prefix="$RUNNER_TEMP/fuzz-artifacts/$target-" \
              || failed+=("$target")
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::fuzz targets failed: ${failed[*]}"
            exit 1
          fi

      # Each target's corpus shrinks to the inputs that reach new coverage,
      # so it stays small however many nights it grows.
      - name: Minimise the corpus
        if: ${{ !cancelled() }}
        run: |
          for target in $(cargo "+$NIGHTLY" fuzz list); do
            [ -d "$CORPUS/$target" ] || continue
            before=$(find "$CORPUS/$target" -type f | wc -l)
            cargo "+$NIGHTLY" fuzz cmin -O --target-dir target/fuzz "$target" "$CORPUS/$target" -- \
              -rss_limit_mb=2048 > /dev/null 2>&1 \
              || echo "::warning::could not minimise the corpus of $target"
            after=$(find "$CORPUS/$target" -type f | wc -l)
            echo "$target: $before to $after inputs"
          done

      - name: Keep the corpus for the next night
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CORPUS }}
          key: fuzz-corpus-${{ github.run_id }}

      - name: Fuzz crashes
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: ${{ runner.temp }}/fuzz-artifacts
          if-no-files-found: ignore

  links:
    name: external links
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && inputs.links }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: External links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --exclude-path target --exclude-path node_modules './**/*.md'
          failIfEmpty: false

  # One result for the night under one name: callers' gates look for
  # `nightly / nightly`. A part skipped because a repository does not ask
  # for it counts as passed.
  nightly:
    needs: [miri, udeps-coverage, benchmarks, loom-kani, asan, fuzz, links]
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped")
            | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [ -n "$failed" ]; then
            echo "::error::nightly parts failed: $(echo "$failed" | paste -sd, - | sed 's/,/, /g')"
            exit 1
          fi
          echo "every nightly part passed or was not asked for"
