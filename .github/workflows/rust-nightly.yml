name: Rust nightly

# The checks too slow for a pull request, once a night on the organization
# runners: Miri on the packages a repository names, unused dependencies,
# coverage, external links, benchmarks and, where a repository asks, its fuzz
# targets. Every step runs even after another failed, so one night reports
# everything. Packages that build only for Windows
# (`[package.metadata.enshwick] windows-only = true`) stay out: these checks
# run on the Linux host.

on:
  workflow_call:
    inputs:
      miri:
        description: Packages whose library tests run under Miri, space-separated; none when empty.
        type: string
        default: ""
      links:
        description: Check the external links in the Markdown files with lychee.
        type: boolean
        default: true
      fuzz:
        description: Run every cargo-fuzz target in fuzz/, from its seed corpus in fuzz/corpus/<target>.
        type: boolean
        default: false
      fuzz-seconds:
        description: How long each fuzz target runs.
        type: number
        default: 120

permissions: {}

jobs:
  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: enshwick
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      NIGHTLY: nightly-2026-10-26
      # Built from source: install-action has no prebuilt cargo-fuzz.
      CARGO_FUZZ: 0.13.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Checked out and used by path, as in rust-ci.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: enshwick/.github
          ref: main
          path: .enshwick-ci
          persist-credentials: false
      - uses: ./.enshwick-ci/.github/actions/setup-rust # zizmor: ignore[self-repository]
        with:
          tools: cargo-nextest@0.9.149,cargo-udeps@0.1.61,cargo-llvm-cov@0.9.1

      - name: Toolchains and the packages to check
        id: scope
        run: |
          flock "$RUSTUP_HOME.lock" rustup toolchain install "$NIGHTLY" \
            --profile minimal --component miri,rust-src
          flock "$RUSTUP_HOME.lock" rustup component add llvm-tools
          excludes=$(cargo metadata --no-deps --format-version 1 | jq -r '
            [.packages[] | select(.metadata.enshwick["windows-only"] == true) | "--exclude " + .name]
            | join(" ")')
          hosted=$(cargo metadata --no-deps --format-version 1 | jq '
            [.packages[] | select(.metadata.enshwick["windows-only"] != true)] | length')
          benches=$(cargo metadata --no-deps --format-version 1 | jq '
            [.packages[] | select(.metadata.enshwick["windows-only"] != true)
              | .targets[] | select(.kind | index("bench"))] | length')
          {
            echo "excludes=$excludes"
            echo "hosted=$hosted"
            echo "benches=$benches"
          } >> "$GITHUB_OUTPUT"

      - name: Miri
        if: ${{ !cancelled() && inputs.miri != '' }}
        env:
          PACKAGES: ${{ inputs.miri }}
          # Tests that read fixtures from disk need the file system.
          MIRIFLAGS: -Zmiri-disable-isolation
        run: |
          args=()
          for package in $PACKAGES; do args+=(-p "$package"); done
          cargo "+$NIGHTLY" miri test --lib "${args[@]}"

      - name: Unused dependencies
        if: ${{ !cancelled() && steps.scope.outputs.hosted != '0' }}
        env:
          EXCLUDES: ${{ steps.scope.outputs.excludes }}
        run: |
          # shellcheck disable=SC2086 # one word per flag
          cargo "+$NIGHTLY" udeps --workspace $EXCLUDES --all-targets

      - name: Coverage
        if: ${{ !cancelled() && steps.scope.outputs.hosted != '0' }}
        env:
          EXCLUDES: ${{ steps.scope.outputs.excludes }}
        run: |
          # shellcheck disable=SC2086 # one word per flag
          cargo llvm-cov nextest --workspace $EXCLUDES --no-tests=pass \
            --summary-only | tee "$RUNNER_TEMP/coverage.txt"
          {
            echo '## Coverage'
            echo
            echo '```text'
            cat "$RUNNER_TEMP/coverage.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Benchmarks
        if: ${{ !cancelled() && steps.scope.outputs.benches != '0' }}
        env:
          EXCLUDES: ${{ steps.scope.outputs.excludes }}
        run: |
          # shellcheck disable=SC2086 # one word per flag
          cargo bench --workspace $EXCLUDES

      # A crash fails the step and keeps its input as an artifact. What the
      # runs find stays on the runner: the committed corpus is the seeds.
      - name: Fuzzing
        if: ${{ !cancelled() && inputs.fuzz }}
        env:
          SECONDS_PER_TARGET: ${{ inputs.fuzz-seconds }}
        run: |
          if ! cargo fuzz --version 2> /dev/null | grep -q " $CARGO_FUZZ\$"; then
            flock "$CARGO_HOME.lock" cargo install --locked "cargo-fuzz@$CARGO_FUZZ"
          fi
          mkdir -p "$RUNNER_TEMP/fuzz-artifacts"
          failed=()
          for target in $(cargo "+$NIGHTLY" fuzz list); do
            found="$RUNNER_TEMP/fuzz-corpus/$target"
            mkdir -p "$found"
            cargo "+$NIGHTLY" fuzz run -O --target-dir target/fuzz "$target" \
              "$found" "fuzz/corpus/$target" -- \
              -max_total_time="$SECONDS_PER_TARGET" -rss_limit_mb=2048 \
              -artifact_prefix="$RUNNER_TEMP/fuzz-artifacts/$target-" \
              || failed+=("$target")
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::fuzz targets failed: ${failed[*]}"
            exit 1
          fi

      - name: Fuzz crashes
        if: ${{ !cancelled() && inputs.fuzz }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: ${{ runner.temp }}/fuzz-artifacts
          if-no-files-found: ignore

      - name: External links
        if: ${{ !cancelled() && inputs.links }}
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --exclude-path target --exclude-path node_modules --exclude-path .enshwick-ci './**/*.md'
          failIfEmpty: false

      - name: sccache statistics
        if: always() && env.RUSTC_WRAPPER == 'sccache'
        run: command -v sccache > /dev/null && sccache --show-stats || true
