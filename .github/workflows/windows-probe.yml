name: Windows probe

# What the owner's native Windows runners for branches (label
# `enshwick-pc-branch`) carry: the
# shells, git, Rust, the MSVC build tools and the Windows SDK, Bun. Run by
# hand; it installs nothing machine-wide. These runners share the owner's
# PC, so every job here is short, bounded and leaves nothing behind.

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64, enshwick-pc-branch]
    timeout-minutes: 10
    permissions: {}
    steps:
      # cmd first: it is there on every Windows, bash may not be.
      - name: Shells and git
        shell: cmd
        run: |
          ver
          where bash 2>nul || echo bash: none
          where git 2>nul || echo git: none
          echo RUNNER_TOOL_CACHE=%RUNNER_TOOL_CACHE%
          echo RUNNER_TEMP=%RUNNER_TEMP%
          echo NUMBER_OF_PROCESSORS=%NUMBER_OF_PROCESSORS%

      - name: Toolchains
        shell: bash
        run: |
          set +e
          for tool in git rustup cargo rustc bun cl link signtool; do
            path=$(command -v "$tool")
            echo "$tool: ${path:-none}"
          done
          rustup --version 2> /dev/null && rustup toolchain list
          vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          if [ -x "$vswhere" ]; then
            "$vswhere" -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 \
              -property installationPath
          else
            echo "vswhere: none (no Visual Studio installer)"
          fi
          ls "/c/Program Files (x86)/Windows Kits/10/Lib" 2> /dev/null || echo "Windows SDK: none"
          df -h "$RUNNER_TEMP" 2> /dev/null | tail -1
