name: Mod dev build

# A mod's development build of the commit it runs on, until the first public
# release, 1.0.0: `cargo xtask dist` writes `<package>.zip`, which holds
# `mods/<package>.dll` and the license, and the PDB; they replace the files
# of the caller's single prerelease `dev`, whose tag moves to the commit.
# Players download the zip, and the platform's dev bundle takes it from
# there. A repository whose `cargo xtask dist` writes another archive, such
# as a program, says in `install` what to do with it. The caller grants
# `contents: write`.

on:
  workflow_call:
    inputs:
      install:
        description: What the release notes tell players to do with the zip.
        type: string
        default: Extract the zip into the folder that holds the Enshwick loader.

permissions: {}

jobs:
  build:
    runs-on: enshwick
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Checked out and used by path: the organization refuses actions not
      # pinned by SHA. From main, the only ref the runners run workflows from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: enshwick/.github
          ref: main
          path: .enshwick-ci
          persist-credentials: false
      - uses: ./.enshwick-ci/.github/actions/setup-rust # zizmor: ignore[self-repository]
        with:
          gh: true
          tools: cargo-cyclonedx@0.5.9

      # Reproducible builds: no machine paths in the DLLs and PDBs, no
      # timestamps from the linker, and the PDB named without its path.
      - name: Reproducible build flags
        run: | # zizmor: ignore[github-env] fixed paths only
          {
            echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS=--remap-path-prefix=$GITHUB_WORKSPACE=/build --remap-path-prefix=$CARGO_HOME=/cargo --remap-path-prefix=$RUSTUP_HOME=/rustup -C link-arg=/Brepro -C link-arg=/PDBALTPATH:%_PDB%"
            echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)"
          } >> "$GITHUB_ENV"

      - name: cargo xtask dist
        run: cargo xtask dist --out "$RUNNER_TEMP/dev"

      # A CycloneDX SBOM and the PDB of every DLL this build made.
      - name: SBOMs and PDBs
        run: |
          cargo cyclonedx --format json --target x86_64-pc-windows-msvc --no-build-deps
          cargo metadata --no-deps --format-version 1 | jq -r '
            .packages[] | . as $p | .targets[] | select(.kind | index("cdylib"))
            | [($p.manifest_path | sub("/Cargo.toml$"; "")), $p.name, (.name | gsub("-"; "_"))] | @tsv' |
            while IFS=$'\t' read -r dir package lib; do
              pdb="target/x86_64-pc-windows-msvc/release/$lib.pdb"
              [ -f "$pdb" ] || continue
              cp "$dir/$package.cdx.json" "$RUNNER_TEMP/dev/"
              [ -f "$RUNNER_TEMP/dev/$package.pdb" ] || cp "$pdb" "$RUNNER_TEMP/dev/$package.pdb"
            done

      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/dev/*

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALL: ${{ inputs.install }}
        working-directory: ${{ runner.temp }}/dev
        run: |
          short=$(git -C "$GITHUB_WORKSPACE" rev-parse --short=7 HEAD)
          title="Dev $short"
          notes="Development build of $GITHUB_SHA: $(git -C "$GITHUB_WORKSPACE" log -1 --format=%s).

          Until the first public release, 1.0.0, this prerelease is the only build to download; every run replaces it. $INSTALL"
          # A build without a DLL has no SBOM of its own.
          shopt -s nullglob
          assets=(*.zip *.pdb *.cdx.json)
          if gh release view dev --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/dev" -f sha="$GITHUB_SHA" -F force=true > /dev/null
            gh release edit dev --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$title" --notes "$notes" --prerelease --latest=false
            gh release upload dev "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            # Files of an earlier build that this one no longer has, such as
            # the archive of a mod that now releases from its own repository, go.
            gh release view dev --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
              while read -r name; do
                case " ${assets[*]} " in
                  *" $name "*) ;;
                  *) gh release delete-asset dev "$name" --yes --repo "$GITHUB_REPOSITORY" ;;
                esac
              done
          else
            # A tag left without its release moves too; gh would build on it as it is.
            if gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/dev" > /dev/null 2>&1; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/dev" -f sha="$GITHUB_SHA" -F force=true > /dev/null
            fi
            gh release create dev "${assets[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$title" --notes "$notes" --prerelease --latest=false
          fi

      - name: sccache statistics
        if: always() && env.RUSTC_WRAPPER == 'sccache'
        run: command -v sccache > /dev/null && sccache --show-stats || true
