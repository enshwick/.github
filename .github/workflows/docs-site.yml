name: Docs site

# The documentation site of enshwick/docs: checks and builds it, and puts the
# build on the Cloudflare Worker that the caller's `wrangler.jsonc` names.
# With `deploy` the build goes live; on a pull request from the same
# repository it is uploaded as a preview version, whose address lands in the
# job summary. Both need the two Cloudflare secrets from the caller; without
# them, as on a pull request from a fork, the build is only checked. The
# build collects pages from other public repositories (the platform's book at
# each version's ref), so a deploy also runs when those change, by hand or
# through docs-rebuild.
#
# It runs on a GitHub-hosted runner: it needs none of the organization
# runners' Rust toolchain, sccache, cargo-xwin or Wine, and those runners
# are kept for the jobs that do.

on:
  workflow_call:
    inputs:
      deploy:
        description: Deploy the build to production; off checks, builds and uploads a pull request preview.
        type: boolean
        default: false
    secrets:
      CLOUDFLARE_API_TOKEN:
        description: A token that may edit the account's Workers scripts.
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        description: The Cloudflare account the Worker belongs to.
        required: false

permissions: {}

env:
  WRANGLER_VERSION: 4.156.0

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Whether the caller passed a token, without putting the token itself
      # into every step's environment.
      CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      # Full history: each page's "Last updated" date comes from its last
      # commit, and a shallow clone would date every page to the newest one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      # No lifecycle scripts: the only one installs git hooks, which CI has
      # no use for.
      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run build

      - name: Check
        run: bun run check

      - name: Deploy
        if: inputs.deploy && env.CLOUDFLARE == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx "wrangler@$WRANGLER_VERSION" deploy

      # The Worker is created by the first production deploy; until then a
      # preview has nothing to attach to, and the summary says so.
      - name: Preview
        if: github.event_name == 'pull_request' && env.CLOUDFLARE == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          worker=$(bun -e 'console.log(Bun.JSONC.parse(await Bun.file("wrangler.jsonc").text()).name)')
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$worker/settings")
          case "$status" in
            200) ;;
            404)
              echo "No preview: the Worker \`$worker\` does not exist until the first production deploy." >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
            *)
              echo "::error::Cloudflare answered $status for the Worker $worker"
              exit 1
              ;;
          esac
          bunx "wrangler@$WRANGLER_VERSION" versions upload --preview-alias "pr-$PULL_REQUEST" --message "Pull request #$PULL_REQUEST"
          url=$(jq -r 'select(.type == "version-upload") | .preview_alias_url // .preview_url // empty' "$WRANGLER_OUTPUT_FILE_PATH")
          if [ -z "$url" ]; then
            echo "::error::wrangler printed no preview address"
            exit 1
          fi
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
