name: Rust fuzz

# A short run of every cargo-fuzz target in a repository's fuzz/, from its
# seed corpus, for pull requests that touch what the targets read. The
# nightly lane runs the same targets for minutes; this run is seconds each,
# under a minute of fuzzing in all.

on:
  workflow_call:
    inputs:
      seconds:
        description: How long each fuzz target runs.
        type: number
        default: 4

permissions: {}

jobs:
  fuzz:
    # A pull request lane job: GitHub's runners, so the organization's never
    # wait on it.
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NIGHTLY: nightly-2026-10-27
      # Built from source: install-action has no prebuilt cargo-fuzz.
      CARGO_FUZZ: 0.13.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Checked out and used by path, as in rust-ci.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: enshwick/.github
          ref: main
          path: .enshwick-ci
          persist-credentials: false
      - uses: ./.enshwick-ci/.github/actions/setup-rust # zizmor: ignore[self-repository]
        with:
          # Fuzz builds compile dependencies' C and C++ under the sanitizer.
          sanitizers: true
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # A cache saved by a failed run would be restored as it is and
          # never replaced, so only a finished run saves one.
          prefix-key: v1-fuzz

      - name: Fuzzing
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds }}
        run: |
          flock "$RUSTUP_HOME.lock" rustup toolchain install "$NIGHTLY" \
            --profile minimal --component rust-src
          if ! cargo fuzz --version 2> /dev/null | grep -q " $CARGO_FUZZ\$"; then
            flock "$CARGO_HOME.lock" cargo install --locked "cargo-fuzz@$CARGO_FUZZ"
          fi
          cargo "+$NIGHTLY" fuzz build -O --target-dir target/fuzz
          mkdir -p "$RUNNER_TEMP/fuzz-artifacts"
          failed=()
          for target in $(cargo "+$NIGHTLY" fuzz list); do
            found="$RUNNER_TEMP/fuzz-corpus/$target"
            mkdir -p "$found"
            cargo "+$NIGHTLY" fuzz run -O --target-dir target/fuzz "$target" \
              "$found" "fuzz/corpus/$target" -- \
              -max_total_time="$SECONDS_PER_TARGET" -rss_limit_mb=2048 \
              -artifact_prefix="$RUNNER_TEMP/fuzz-artifacts/$target-" \
              || failed+=("$target")
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::fuzz targets failed: ${failed[*]}"
            exit 1
          fi

      - name: Fuzz crashes
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: ${{ runner.temp }}/fuzz-artifacts
          if-no-files-found: ignore

      - name: sccache statistics
        if: always() && env.RUSTC_WRAPPER == 'sccache'
        run: command -v sccache > /dev/null && sccache --show-stats || true
