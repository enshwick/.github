name: Windows native tests

# By hand: tests of an enshwick repository at any of its refs, natively on
# the owner's PC (label `enshwick-pc`), with the output shown. For chasing
# failures that Wine does not show. Only members can start it, and it runs
# only the organization's own branches, the trust the pull request lane on
# the same runners already gives them. The PC is the owner's: one job,
# bounded. With `asan`, the tests run under AddressSanitizer: the pinned
# nightly instruments them, and the runtime is clang's, from the LLVM the
# setup already unpacks; no Visual Studio is needed.

on:
  workflow_dispatch:
    inputs:
      repository:
        description: The repository, owner/name.
        type: string
        default: enshwick/enshwick
      ref:
        description: Branch, tag or commit to test.
        type: string
        required: true
      package:
        description: The package whose tests run.
        type: string
        default: enshwick-loader
      filter:
        description: Test name filters, space-separated; all tests when empty.
        type: string
        default: ""
      asan:
        description: Run the tests under AddressSanitizer.
        type: boolean
        default: false

permissions: {}

concurrency:
  group: windows-native-tests
  cancel-in-progress: false

jobs:
  tests:
    runs-on: [self-hosted, Windows, X64, enshwick-pc]
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      # Git settings for this job only: the ten runners share one user
      # profile, and writing its global config at once fails on the lock.
      # Long paths for the work tree; no CRLF, which rustfmt rejects.
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: "true"
      GIT_CONFIG_KEY_1: core.autocrlf
      GIT_CONFIG_VALUE_1: "false"
      CARGO_BUILD_JOBS: "3"
      NIGHTLY: nightly-2026-10-27
    steps:
      - name: Only the organization's repositories
        env:
          REPOSITORY: ${{ inputs.repository }}
        run: |
          case "$REPOSITORY" in
            enshwick/*) ;;
            *) echo "::error::only enshwick/* repositories"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: enshwick/.github
          ref: main
          path: .enshwick-ci
          persist-credentials: false

      - uses: ./.enshwick-ci/.github/actions/setup-rust-windows # zizmor: ignore[self-repository]

      - name: Tests
        env:
          PACKAGE: ${{ inputs.package }}
          FILTER: ${{ inputs.filter }}
          ASAN: ${{ inputs.asan }}
        run: |
          eval "$(cargo xwin env --target x86_64-pc-windows-msvc | grep -v '^export PATH=')"
          unset CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUNNER
          toolchain=()
          if [ "$ASAN" = true ]; then
            lock="${ENSHWICK_PC_CACHE:-C:/enshwick-ci}/.lock"
            until mkdir "$lock" 2> /dev/null; do
              if [ -n "$(find "$lock" -maxdepth 0 -mmin +15 2> /dev/null)" ]; then rmdir "$lock"; fi
              sleep 2
            done
            trap 'rmdir "$lock" 2> /dev/null || true' EXIT
            rustup toolchain install "$NIGHTLY" --profile minimal --target x86_64-pc-windows-msvc
            rmdir "$lock"
            toolchain=("+$NIGHTLY")
            runtime=$(compgen -G "$(dirname "$(command -v clang-cl)")/../lib/clang/*/lib/windows" | head -n 1)
            # By path: the CRT folder may hold Microsoft's import library of
            # the same name, for a runtime that is not here.
            libs=$(cygpath -m "$runtime")
            # rustc hands the MSVC linker /INFERASANLIBS and any other its own
            # runtime, which no Windows toolchain ships; lld named `link`
            # links as link.exe, and the runtime is named outright. The
            # static CRT and UCRT import runtime functions only Microsoft's
            # own build of it exports, so these tests link both dynamically.
            mkdir -p "$RUNNER_TEMP/asan-link"
            cp "$(command -v lld-link)" "$RUNNER_TEMP/asan-link/link.exe"
            flags=${CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS/-C linker-flavor=lld-link/}
            flags=${flags/-C link-arg=-nodefaultlib:ucrt -C link-arg=-defaultlib:libucrt/}
            export CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER="$RUNNER_TEMP/asan-link/link.exe"
            export CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS="$flags -C linker-flavor=msvc -C target-feature=-crt-static -Zsanitizer=address --cfg enshwick_asan -Clink-arg=$libs/clang_rt.asan_dynamic-x86_64.lib -Clink-arg=/wholearchive:$libs/clang_rt.asan_dynamic_runtime_thunk-x86_64.lib"
            # `enshwick_asan` tells the code it runs sanitized, for what the
            # sanitizer must leave alone, such as walks over other threads'
            # stacks. An empty RUSTFLAGS from cargo-xwin would hide the
            # target's flags.
            unset RUSTFLAGS
            export PATH="$runtime:$PATH"
          fi
          git log -1 --format='%H %s'
          read -ra filters <<< "$FILTER"
          if ! cargo "${toolchain[@]}" test --target x86_64-pc-windows-msvc -p "$PACKAGE" --lib -- "${filters[@]}" --test-threads 1 --nocapture; then
            # A test executable that does not start names the DLLs it lacks.
            if [ "$ASAN" = true ]; then
              echo "runtime: ${runtime:-none}"
              echo "flags: $CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS"
              objdump="$(rustc --print sysroot)/lib/rustlib/x86_64-pc-windows-msvc/bin/llvm-objdump.exe"
              dll="$runtime/clang_rt.asan_dynamic-x86_64.dll"
              "$objdump" -p "$dll" | sed -n '/Export Table/,$p' | awk '{print $NF}' | sort -u > "$RUNNER_TEMP/exports"
              find target/x86_64-pc-windows-msvc -name '*.exe' -path '*/out/*' -newer Cargo.toml |
                while read -r exe; do
                  # What the test takes from the runtime that the runtime lacks.
                  "$objdump" -p "$exe" | awk '/DLL Name:/{d=$3} d ~ /clang_rt/ && /^ +[0-9]+ +[A-Za-z_]/{print $2}' |
                    sort -u | comm -23 - "$RUNNER_TEMP/exports" | sed 's/^/missing from the runtime: /'
                done
              find target/x86_64-pc-windows-msvc -name '*.exe' -path '*/out/*' -newer Cargo.toml -exec ldd {} \; || true
            fi
            exit 1
          fi

      - name: Clean up
        if: always()
        run: rm -rf target
