name: Bundle rebuild

# Starts the platform's dev-build on enshwick/enshwick after a mod's dev
# build, so the dev bundle's enshwick.zip, which takes each mod from its
# `dev` prerelease, carries the mod just built. Only a mod that
# tools/mods.toml lists is in the bundle; any other caller starts nothing,
# and so does every caller once the platform has no tools/mods.toml.
# The platform's dev-build runs one at a time and builds only the newest of
# the runs that wait, so a burst of mod builds ends in one bundle.

on:
  workflow_call:
    secrets:
      ENSHWICK_CI_CLIENT_ID:
        description: The enshwick-ci app, which may start workflows on enshwick/enshwick.
        required: true
      ENSHWICK_CI_PRIVATE_KEY:
        description: The enshwick-ci app's private key.
        required: true

permissions: {}

jobs:
  start:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Token for enshwick/enshwick
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.ENSHWICK_CI_CLIENT_ID }}
          private-key: ${{ secrets.ENSHWICK_CI_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: enshwick
          permission-actions: write
          permission-contents: read

      - name: Start the bundle build
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          platform="$GITHUB_REPOSITORY_OWNER/enshwick"
          listed=$(gh api "repos/$platform/contents/tools" --jq '.[] | select(.name == "mods.toml") | .name')
          if [[ -z "$listed" ]]; then
            echo "$platform has no dev bundle; nothing to rebuild."
            exit 0
          fi
          mods=$(gh api "repos/$platform/contents/tools/mods.toml" -H 'Accept: application/vnd.github.raw')
          if ! grep -qxF "repository = \"$GITHUB_REPOSITORY\"" <<< "$mods"; then
            echo "$GITHUB_REPOSITORY is not in the dev bundle; nothing to rebuild."
            exit 0
          fi
          gh workflow run dev-build.yml --repo "$platform" --ref main -f publish=true
