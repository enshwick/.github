name: Runner image

# Builds runner-image/Dockerfile and pushes it to ghcr.io/enshwick/runner,
# tagged with the commit (and `main` from the default branch), with a build provenance attestation. The runner
# scale set pins the image by digest; this workflow prints the digest.
#
# It runs on a GitHub-hosted runner: the organization runners have no
# Docker daemon, and the job builds an image without checking out or
# running any product code.

on:
  push:
    branches: [main]
    paths:
      - runner-image/**
      - .github/workflows/runner-image.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: runner-image
  cancel-in-progress: false

jobs:
  image:
    if: github.repository == 'enshwick/.github'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: runner-image
          platforms: linux/amd64
          push: true
          provenance: false
          # `main` follows the default branch, for a digest pin that names it.
          tags: |
            ghcr.io/enshwick/runner:sha-${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && 'ghcr.io/enshwick/runner:main' || '' }}

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/enshwick/runner
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ghcr.io/enshwick/runner@$DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"
