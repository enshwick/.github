name: Set up Rust on Windows
description: >-
  On the owner's Windows runners: the pinned toolchain, cargo-xwin with the
  Windows SDK and CRT, the toolchain's lld as lld-link and sccache, all in
  one cache directory the runners share. No Visual Studio, nothing installed
  machine-wide. Git Bash only.

runs:
  using: composite
  steps:
    # The runners share one cache; a directory made with mkdir is the lock
    # (Git Bash has no flock), taken over when a killed job left it behind.
    - name: Toolchain in the shared cache
      shell: bash
      run: | # zizmor: ignore[github-env] fixed paths only
        cache="${ENSHWICK_PC_CACHE:-C:/enshwick-ci}"
        mkdir -p "$cache"
        lock="$cache/.lock"
        until mkdir "$lock" 2> /dev/null; do
          if [ -n "$(find "$lock" -maxdepth 0 -mmin +15 2> /dev/null)" ]; then rmdir "$lock"; fi
          sleep 2
        done
        trap 'rmdir "$lock"' EXIT
        export RUSTUP_HOME="$cache/rustup" CARGO_HOME="$cache/cargo"
        if [ ! -x "$CARGO_HOME/bin/rustup.exe" ]; then
          curl --proto '=https' --tlsv1.2 -sSfL -o "$RUNNER_TEMP/rustup-init.exe" \
            https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe
          "$RUNNER_TEMP/rustup-init.exe" -y --profile minimal --default-toolchain none --no-modify-path
        fi
        "$CARGO_HOME/bin/rustup.exe" toolchain install
        "$CARGO_HOME/bin/rustup.exe" component add llvm-tools
        sysroot=$("$CARGO_HOME/bin/rustc.exe" --print sysroot)
        bin="$sysroot/lib/rustlib/x86_64-pc-windows-msvc/bin"
        mkdir -p "$RUNNER_TEMP/lld"
        cp "$bin/rust-lld.exe" "$RUNNER_TEMP/lld/lld-link.exe"
        cp "$bin/llvm-ar.exe" "$RUNNER_TEMP/lld/llvm-lib.exe"
        {
          echo "RUSTUP_HOME=$RUSTUP_HOME"
          echo "CARGO_HOME=$CARGO_HOME"
          echo "XWIN_CACHE_DIR=$cache/xwin"
          echo "SCCACHE_DIR=$cache/sccache"
          echo "SCCACHE_CACHE_SIZE=20G"
          # One sccache server per runner: on the shared default port one
          # job's server going away dropped another job's compiles.
          # A lost connection to the server compiles without the cache
          # instead of failing the build.
          echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1"
          echo "SCCACHE_SERVER_PORT=$((4300 + $(printf '%s' "$RUNNER_NAME" | cksum | cut -d' ' -f1) % 1000))"
          echo "CARGO_INCREMENTAL=0"
          # The PC's network breaks cargo's HTTP/2 streams now and then.
          echo "CARGO_HTTP_MULTIPLEXING=false"
          echo "CARGO_TERM_COLOR=always"
        } >> "$GITHUB_ENV"
        echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
        echo "$RUNNER_TEMP/lld" >> "$GITHUB_PATH"

    # cargo-xwin and sccache from their releases, checked against pinned
    # checksums and unpacked once into the shared cache; install-action
    # needs PowerShell, which these runners do not carry.
    - name: cargo-xwin and sccache
      shell: bash
      env:
        XWIN_VERSION: 0.23.1
        XWIN_SHA256: 114534c57cdcca604f59c9d70024583d20ff7c5505677f06247e971184a23872
        SCCACHE_VERSION: 0.18.0
        SCCACHE_SHA256: 8965c74d5e8a225244f741e18ad2f3f504f48228dc1bac948fc22761a348363d
        NEXTEST_VERSION: 0.9.149
        NEXTEST_SHA256: bf904b85c7c5c2a29c340053a8d9d8e8027ff0d55a2bf7cef7d23032f8166438
        DENY_VERSION: 0.20.2
        DENY_SHA256: 975a22143262fd27476d19ee00c7af67978426e40e1dee94eed6bbade1cf87dc
        LLVM_VERSION: 23.1.3
        LLVM_SHA256: 9ee6a2192fbb30c776415af529927f76ca6b5d1d55699bb1315f9878e610b5b8
      run: | # zizmor: ignore[github-env] fixed paths only
        cache="${ENSHWICK_PC_CACHE:-C:/enshwick-ci}"
        lock="$cache/.lock"
        until mkdir "$lock" 2> /dev/null; do
          if [ -n "$(find "$lock" -maxdepth 0 -mmin +15 2> /dev/null)" ]; then rmdir "$lock"; fi
          sleep 2
        done
        trap 'rmdir "$lock"' EXIT
        fetch() { # name version sha256 url
          dir="$cache/tools/$1-$2"
          if [ ! -d "$dir" ]; then
            archive="$RUNNER_TEMP/$1.${4##*.}"
            curl --proto '=https' --tlsv1.2 -sSfL -o "$archive" "$4"
            echo "$3  $archive" | sha256sum -c -
            mkdir -p "$dir.part"
            /c/Windows/System32/tar.exe -xf "$archive" -C "$dir.part"
            find "$dir.part" -name '*.exe' -exec mv {} "$dir.part/" \;
            mv "$dir.part" "$dir"
          fi
          echo "$dir" >> "$GITHUB_PATH"
        }
        fetch cargo-xwin "$XWIN_VERSION" "$XWIN_SHA256" \
          "https://github.com/rust-cross/cargo-xwin/releases/download/v$XWIN_VERSION/cargo-xwin-v$XWIN_VERSION.windows-x64.zip"
        fetch sccache "$SCCACHE_VERSION" "$SCCACHE_SHA256" \
          "https://github.com/mozilla/sccache/releases/download/v$SCCACHE_VERSION/sccache-v$SCCACHE_VERSION-x86_64-pc-windows-msvc.zip"
        fetch cargo-nextest "$NEXTEST_VERSION" "$NEXTEST_SHA256" \
          "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$NEXTEST_VERSION/cargo-nextest-$NEXTEST_VERSION-x86_64-pc-windows-msvc.zip"
        fetch cargo-deny "$DENY_VERSION" "$DENY_SHA256" \
          "https://github.com/EmbarkStudios/cargo-deny/releases/download/$DENY_VERSION/cargo-deny-$DENY_VERSION-x86_64-pc-windows-msvc.tar.gz"
        # clang-cl and its headers alone, for the few crates that build C
        # for Windows; the rest of LLVM stays in the archive.
        llvm="$cache/tools/llvm-$LLVM_VERSION"
        if [ ! -d "$llvm" ]; then
          name="clang+llvm-$LLVM_VERSION-x86_64-pc-windows-msvc"
          archive="$RUNNER_TEMP/llvm.tar.xz"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$archive" \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/$name.tar.xz"
          echo "$LLVM_SHA256  $archive" | sha256sum -c -
          mkdir -p "$llvm.part"
          /c/Windows/System32/tar.exe -xf "$archive" -C "$llvm.part" --strip-components 1 \
            "$name/bin/clang-cl.exe" "$name/lib/clang"
          rm -f "$archive"
          mv "$llvm.part" "$llvm"
        fi
        echo "$llvm/bin" >> "$GITHUB_PATH"

    # The Windows SDK and CRT: cargo-xwin downloads them once into the
    # shared cache, under the lock.
    - name: The Windows SDK
      shell: bash
      run: | # zizmor: ignore[github-env] fixed paths only
        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
        lock="${ENSHWICK_PC_CACHE:-C:/enshwick-ci}/.lock"
        until mkdir "$lock" 2> /dev/null; do
          if [ -n "$(find "$lock" -maxdepth 0 -mmin +15 2> /dev/null)" ]; then rmdir "$lock"; fi
          sleep 2
        done
        trap 'rmdir "$lock"' EXIT
        cargo xwin env --target x86_64-pc-windows-msvc > /dev/null
        rustc --version
        lld-link --version
