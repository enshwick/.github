name: Set up Rust
description: >-
  Rust from rust-toolchain.toml, cargo-xwin for the Windows target and
  sccache, kept in the runners' persistent tool cache.

inputs:
  tools:
    description: More tools for taiki-e/install-action, comma-separated (cargo-nextest,cargo-deny).
    default: ""
  wine:
    description: Install Wine to run Windows test executables.
    default: "false"
  sanitizers:
    description: Install clang's sanitizer headers, for C and C++ that dependencies build under a sanitizer.
    default: "false"
  gh:
    description: Install the GitHub CLI, for steps that publish releases.
    default: "false"

runs:
  using: composite
  steps:
    - name: Point caches at the tool cache
      shell: bash
      run: | # zizmor: ignore[github-env] fixed paths only

        cache="${RUNNER_TOOL_CACHE:-$HOME/.cache}"
        {
          echo "RUSTUP_HOME=$cache/rustup"
          echo "CARGO_HOME=$cache/cargo"
          echo "XWIN_CACHE_DIR=$cache/xwin"
          echo "CARGO_INCREMENTAL=0"
          echo "CARGO_TERM_COLOR=always"
        } >> "$GITHUB_ENV"
        echo "$cache/cargo/bin" >> "$GITHUB_PATH"
        if [ -d /ci-cache/sccache ] && [ -w /ci-cache/sccache ]; then
          {
            echo "SCCACHE_DIR=/ci-cache/sccache"
            echo "SCCACHE_CACHE_SIZE=15G"
            echo "RUSTC_WRAPPER=sccache"
            # A lost connection to the server compiles without the cache
            # instead of failing the build.
            echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1"
          } >> "$GITHUB_ENV"
        fi

    # Wine runs Windows test executables. Downloaded packages stay in the
    # tool cache between jobs.
    - name: Install Wine
      if: inputs.wine == 'true'
      shell: bash
      run: |
        if ! dpkg -s wine > /dev/null 2>&1 && ! command -v wine > /dev/null; then
          # Concurrent jobs share the cache, so apt works in a directory of
          # its own (it locks it) and the packages are copied in and out.
          shared="${RUNNER_TOOL_CACHE:-$HOME/.cache}/apt-archives"
          archives="$RUNNER_TEMP/apt"
          mkdir -p "$shared" "$archives/partial"
          cp -n "$shared"/*.deb "$archives"/ 2> /dev/null || true
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Dir::Cache::archives="$archives" \
            install -y -qq --no-install-recommends wine wine64
          cp -n "$archives"/*.deb "$shared"/ 2> /dev/null || true
        fi
        # The runner image carries a prefix already.
        if [ ! -f "${WINEPREFIX:-$HOME/.wine}/system.reg" ]; then
          WINEDEBUG=-all wineboot -i > /dev/null 2>&1 || true
        fi
        echo "WINEDEBUG=-all" >> "$GITHUB_ENV"

    - name: Install the toolchain
      shell: bash
      run: |
        if ! command -v rustup > /dev/null; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
        fi
        # Jobs share RUSTUP_HOME: one installs a new toolchain at a time.
        flock "$RUSTUP_HOME.lock" rustup toolchain install
        rustc --version

    # clang of the Rust toolchain's own LLVM major, from apt.llvm.org, for
    # the C and C++ that dependencies build: cargo-xwin calls it as
    # clang-cl, the MSVC headers refuse an old one, and one LLVM keeps
    # objects, sanitizer runtime and linker in step. The runner image
    # carries it; elsewhere it is installed here, the packages kept in the
    # tool cache. With `sanitizers`, also its sanitizer runtime and headers.
    - name: clang of the toolchain's LLVM
      shell: bash
      env:
        SANITIZERS: ${{ inputs.sanitizers }}
        # The key apt.llvm.org signs with (6084F3CF814B57C1CF12EFD515CF4D18AF4F7421).
        LLVM_KEY_SHA256: 8b2a587ffd672c4687e7581dad4b2f6c1bb2ad6b480cd9771ba2ff48e0b8c75d
      run: | # zizmor: ignore[github-env] fixed paths only
        major=$(rustc -vV | sed -n 's/^LLVM version: \([0-9]*\).*/\1/p')
        test -n "$major"
        llvm="/usr/lib/llvm-$major"
        packages=()
        [ -x "$llvm/bin/clang" ] || packages+=("clang-$major")
        if [ "$SANITIZERS" = true ] && ! compgen -G "$llvm/lib/clang/*/include/sanitizer/asan_interface.h" > /dev/null; then
          packages+=("libclang-rt-$major-dev")
        fi
        if [ ${#packages[@]} -gt 0 ]; then
          codename=$(sed -n 's/^VERSION_CODENAME=//p' /etc/os-release)
          key=/etc/apt/keyrings/apt-llvm.asc
          if [ ! -f "$key" ]; then
            curl --proto '=https' --tlsv1.2 -sSfL -o "$RUNNER_TEMP/llvm.asc" https://apt.llvm.org/llvm-snapshot.gpg.key
            echo "$LLVM_KEY_SHA256  $RUNNER_TEMP/llvm.asc" | sha256sum -c -
            sudo install -D -m 0644 "$RUNNER_TEMP/llvm.asc" "$key"
          fi
          echo "deb [signed-by=$key] https://apt.llvm.org/$codename/ llvm-toolchain-$codename-$major main" |
            sudo tee "/etc/apt/sources.list.d/llvm-$major.list" > /dev/null
          shared="${RUNNER_TOOL_CACHE:-$HOME/.cache}/apt-archives"
          archives="$RUNNER_TEMP/apt"
          mkdir -p "$shared" "$archives/partial"
          cp -n "$shared"/*.deb "$archives"/ 2> /dev/null || true
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Dir::Cache::archives="$archives" \
            install -y -qq --no-install-recommends "${packages[@]}"
          cp -n "$archives"/*.deb "$shared"/ 2> /dev/null || true
        fi
        # Ahead of the distribution's clang. Ubuntu's packages carry no
        # clang-cl; clang called by that name works as one.
        mkdir -p "$RUNNER_TEMP/llvm"
        ln -sf "$llvm/bin/clang" "$RUNNER_TEMP/llvm/clang"
        ln -sf "$llvm/bin/clang" "$RUNNER_TEMP/llvm/clang-cl"
        ln -sf "$llvm/bin/clang++" "$RUNNER_TEMP/llvm/clang++"
        echo "$RUNNER_TEMP/llvm" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/llvm/clang-cl" --version | sed -n 1p

    # Windows binaries link with the toolchain's own lld (rust-lld, LLVM of
    # the pinned Rust) under the name lld-link, ahead of the distribution's
    # older lld-link: LLVM 18's segfaulted now and then writing a large PDB.
    # The toolchain's llvm-ar serves as llvm-lib, which cc needs for C code
    # built for Windows and GitHub's runner image does not carry.
    - name: Link with the toolchain's lld
      shell: bash
      run: | # zizmor: ignore[github-env] fixed paths only
        lld="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin/rust-lld"
        test -x "$lld"
        mkdir -p "$RUNNER_TEMP/lld"
        ln -sf "$lld" "$RUNNER_TEMP/lld/lld-link"
        flock "$RUSTUP_HOME.lock" rustup component add llvm-tools > /dev/null
        ln -sf "$(dirname "$lld")/llvm-ar" "$RUNNER_TEMP/lld/llvm-lib"
        echo "$RUNNER_TEMP/lld" >> "$GITHUB_PATH"
        "$lld" -flavor link --version

    # Each job installs the tools into a directory of its own: installing
    # into the shared cache would overwrite a binary a concurrent job is
    # running ("text file busy"). The prebuilt downloads take seconds.
    - name: Give the tools a directory of this job
      shell: bash
      run: | # zizmor: ignore[github-env] fixed paths only
        tools="$RUNNER_TEMP/tools"
        mkdir -p "$tools/bin"
        ln -sf "$(command -v cargo)" "$tools/bin/cargo"
        echo "SHARED_CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
        echo "CARGO_HOME=$tools" >> "$GITHUB_ENV"
        echo "$tools/bin" >> "$GITHUB_PATH"

    # The runner image lists the tools it carries; only the others are
    # installed.
    - name: Tools the image lacks
      id: tools
      shell: bash
      env:
        TOOLS: cargo-xwin@0.23.1,sccache@0.19.0${{ inputs.tools != '' && format(',{0}', inputs.tools) || '' }}
      run: |
        missing=()
        IFS=, read -ra wanted <<< "$TOOLS"
        for tool in "${wanted[@]}"; do
          grep -qxF "$tool" /opt/enshwick-tools/list 2> /dev/null || missing+=("$tool")
        done
        echo "missing=$(IFS=,; echo "${missing[*]}")" >> "$GITHUB_OUTPUT"

    # Every version here must be in install-action's manifests at this SHA:
    # a version it lacks falls back to cargo-binstall, which fails in the
    # per-job tools directory.
    - if: steps.tools.outputs.missing != ''
      uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
      with:
        tool: ${{ steps.tools.outputs.missing }}

    - name: Share the registry cache again
      shell: bash
      run: | # zizmor: ignore[github-env] fixed paths only
        echo "CARGO_HOME=$SHARED_CARGO_HOME" >> "$GITHUB_ENV"

    # The release, unpacked beside the cache and renamed into place, so a
    # job never sees a half-written copy.
    - name: Install gh
      if: inputs.gh == 'true'
      shell: bash
      env:
        GH_VERSION: 2.103.3
        GH_SHA256: 4c806978ffce1cec70853302a56d70ac6da4f19bae7adca4e1a8ab00633dd91d
      run: | # zizmor: ignore[github-env] fixed paths only
        dir="${RUNNER_TOOL_CACHE:-$HOME/.cache}/gh/$GH_VERSION"
        if [ ! -x "$dir/bin/gh" ]; then
          archive="$RUNNER_TEMP/gh.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$archive" \
            "https://github.com/cli/cli/releases/download/v$GH_VERSION/gh_${GH_VERSION}_linux_amd64.tar.gz"
          echo "$GH_SHA256  $archive" | sha256sum -c -
          staging="$(dirname "$dir")/.staging-$GITHUB_RUN_ID-$GITHUB_JOB-$$"
          mkdir -p "$staging"
          tar -xzf "$archive" -C "$staging" --strip-components 1
          mv -T "$staging" "$dir" 2> /dev/null || rm -rf "$staging"
        fi
        echo "$dir/bin" >> "$GITHUB_PATH"
        "$dir/bin/gh" --version
