# Replaces the mod's DLL on the rolling `dev` prerelease on every push to main
# that changes what the DLL builds from, then rebuilds the docs site and the
# platform's dev bundle, which carry the mod.
name: dev-build

on:
  push:
    branches: [main]
    paths:
      - "**/src/**"
      - "**/Cargo.toml"
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/**
      - LICENSE
      - .github/workflows/dev-build.yml
  workflow_dispatch:

permissions: {}

# One build at a time; of the pushes that wait, only the newest is built.
concurrency:
  group: dev-build
  cancel-in-progress: false

jobs:
  build:
    # main: the organization runners run only workflows from main.
    uses: enshwick/.github/.github/workflows/mod-dev-build.yml@main # zizmor: ignore[unpinned-uses]
    permissions:
      contents: write
      id-token: write
      attestations: write

  # The docs site takes the mod's page from its newest release; start the
  # site's build once the prerelease moved.
  docs:
    needs: build
    uses: enshwick/.github/.github/workflows/docs-rebuild.yml@main # zizmor: ignore[unpinned-uses]
    secrets:
      ENSHWICK_CI_CLIENT_ID: ${{ secrets.ENSHWICK_CI_CLIENT_ID }}
      ENSHWICK_CI_PRIVATE_KEY: ${{ secrets.ENSHWICK_CI_PRIVATE_KEY }}

  # The platform's dev bundle takes the mod from its dev prerelease.
  bundle:
    needs: build
    uses: enshwick/.github/.github/workflows/bundle-rebuild.yml@main # zizmor: ignore[unpinned-uses]
    secrets:
      ENSHWICK_CI_CLIENT_ID: ${{ secrets.ENSHWICK_CI_CLIENT_ID }}
      ENSHWICK_CI_PRIVATE_KEY: ${{ secrets.ENSHWICK_CI_PRIVATE_KEY }}
