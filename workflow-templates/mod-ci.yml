# The merge gate: `cargo xtask check` through the shared workflow, on
# GitHub-hosted runners, the Windows tests on a Windows one. A push to main
# fills the build caches pull requests start from.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  # Only a pull request's newer push cancels its older run: a run on main
  # fills the caches pull requests start from and must finish.
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    uses: enshwick/.github/.github/workflows/rust-ci.yml@main # zizmor: ignore[unpinned-uses]
    permissions:
      contents: read
